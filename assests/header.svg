<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>

  <circle cx="80" cy="50" r="3" fill="#8B5CF6">
    <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1130" cy="210" r="4" fill="#60A5FA">
    <animate attributeName="cy" values="210;195;210" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(850 55)">
    <rect x="0" y="0" width="230" height="145" rx="10"
          fill="#111827"
          stroke="#818CF8"
          stroke-width="3"/>

    <text x="25" y="38"
          fill="#22C55E"
          font-family="monospace"
          font-size="18">
      &lt;/&gt;
    </text>

    <rect x="25" y="58" width="130" height="6" rx="3" fill="#60A5FA"/>
    <rect x="25" y="78" width="170" height="6" rx="3" fill="#A78BFA"/>
    <rect x="25" y="98" width="90" height="6" rx="3" fill="#34D399"/>
    <rect x="25" y="118" width="150" height="6" rx="3" fill="#F472B6"/>

    <rect x="182" y="115" width="4" height="12" fill="#fff">
      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="-18" y="145"
          width="266"
          height="12"
          rx="6"
          fill="#CBD5E1"/>
  </g>

  <text x="80"
        y="115"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="46"
        font-weight="600"
        fill="white">
    Hi 👋,
  </text>

  <text x="80"
        y="175"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="62"
        font-weight="700"
        fill="url(#text)"
        filter="url(#glow)">
    I'm Mudita Singh
  </text>

  <text x="82"
        y="220"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="26"
        fill="#CBD5E1">
    Developer
  </text>

</svg>
