<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <rect width="960" height="300" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- desk -->
    <path d="M150 245H810" stroke="#777" stroke-width="1"/>
    <path d="M350 222H690" stroke="#777" stroke-width="1"/>

    <!-- monitor -->
    <rect x="385" y="75" width="250" height="130"/>
    <rect x="398" y="88" width="224" height="103" stroke="#777" stroke-width="1"/>
    <path d="M510 205v21M475 228h70"/>

    <!-- keyboard -->
    <rect x="420" y="231" width="180" height="12" stroke-width="1"/>
    <g stroke="#777" stroke-width="2">
      <path d="M428 235h7M440 235h7M452 235h7M464 235h7M476 235h7M488 235h7M500 235h7M512 235h7M524 235h7M536 235h7M548 235h7M560 235h7M572 235h7"/>
    </g>

    <!-- code -->
    <g font-family="monospace" font-size="12" fill="#fff" stroke="none">
      <text x="410" y="110">const</text>
      <text x="462" y="110">build()</text>
      <text x="410" y="126" fill="#999">repeat()</text>
    </g>
    <rect x="610" y="119" width="6" height="12" fill="#fff" stroke="none">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- tiny coder cat -->
    <g transform="translate(270 92)">
      <!-- head -->
      <ellipse cx="55" cy="43" rx="34" ry="30"/>
      <!-- ears -->
      <path d="M27 27L28 6L43 21M68 21L84 6L83 29"/>
      <!-- eyes -->
      <circle cx="44" cy="43" r="2.5" fill="#fff" stroke="none"/>
      <circle cx="66" cy="43" r="2.5" fill="#fff" stroke="none"/>
      <!-- face -->
      <path d="M52 51l3 3 3-3"/>
      <path d="M55 54l-5 5M55 54l5 5" stroke="#777" stroke-width="1.5"/>
      <!-- body -->
      <ellipse cx="67" cy="92" rx="31" ry="29"/>
      <!-- tail, animated -->
      <path d="M91 108C120 115 139 105 136 88"
            fill="none">
        <animate attributeName="d"
          values="M91 108C120 115 139 105 136 88;
                  M91 108C120 119 145 111 140 86;
                  M91 108C120 115 139 105 136 88"
          dur="2.4s" repeatCount="indefinite"/>
      </path>
      <!-- body idle breathing -->
      <animateTransform attributeName="transform" type="translate"
        values="270 92;270 90;270 92" dur="2.8s" repeatCount="indefinite"/>
    </g>

    <!-- coffee -->
    <rect x="185" y="214" width="29" height="25"/>
    <path d="M214 218c18 0 18 16 0 16"/>
    <!-- steam -->
    <path d="M198 205c-4-6 5-8 1-14M208 205c-4-6 5-8 1-14"
          stroke="#888" stroke-width="1.5">
      <animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- floating symbols -->
    <g font-family="monospace" font-size="13" fill="#aaa" stroke="none">
      <text x="168" y="124">&lt;/&gt;
        <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="735" y="116">&lt;&gt;
        <animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="770" y="150">{ }</text>
    </g>

    <!-- top prompt -->
    <text x="54" y="36" font-family="monospace" font-size="15" fill="#fff" stroke="none">$ build something.</text>

    <!-- bottom typing indicator -->
    <text x="430" y="267" font-family="monospace" font-size="11" fill="#999" stroke="none">typing
      <animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>