<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="name" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <clipPath id="typing">
      <rect x="90" y="0" width="0" height="320">
        <animate
          attributeName="width"
          values="0;520;520"
          dur="2.8s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- Floating particles -->
  <circle cx="70" cy="60" r="3" fill="#8B5CF6">
    <animate attributeName="cy" values="60;45;60" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1100" cy="240" r="4" fill="#60A5FA">
    <animate attributeName="cy" values="240;220;240" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1020" cy="70" r="2" fill="white">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="260" r="2" fill="#A78BFA">
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Text -->
  <text
      x="90"
      y="110"
      font-size="48"
      font-family="Segoe UI"
      font-weight="600"
      fill="white">
      Hi 👋
  </text>

  <g clip-path="url(#typing)">
      <text
          x="90"
          y="180"
          font-size="64"
          font-family="Segoe UI"
          font-weight="700"
          fill="url(#name)">
          I'm Mudita Singh
      </text>
  </g>

  <text
      x="90"
      y="230"
      font-size="28"
      font-family="Segoe UI"
      fill="#CBD5E1"
      opacity="0">
      Developer

      <animate
          attributeName="opacity"
          values="0;0;1;1"
          dur="2.8s"
          repeatCount="indefinite"/>
  </text>

  <!-- Laptop -->
  <g transform="translate(830 70)">

      <rect
          x="0"
          y="0"
          width="240"
          height="150"
          rx="12"
          fill="#111827"
          stroke="#818CF8"
          stroke-width="3"/>

      <text
          x="25"
          y="35"
          font-family="monospace"
          font-size="18"
          fill="#22C55E">

          &lt;/&gt;

      </text>

      <!-- Animated code lines -->

      <rect x="25" y="55" width="0" height="6" rx="3" fill="#60A5FA">
          <animate attributeName="width"
                   values="0;150;150"
                   dur="2s"
                   repeatCount="indefinite"/>
      </rect>

      <rect x="25" y="78" width="0" height="6" rx="3" fill="#C084FC">
          <animate attributeName="width"
                   values="0;180;180"
                   dur="2.3s"
                   repeatCount="indefinite"/>
      </rect>

      <rect x="25" y="101" width="0" height="6" rx="3" fill="#34D399">
          <animate attributeName="width"
                   values="0;120;120"
                   dur="2.6s"
                   repeatCount="indefinite"/>
      </rect>

      <rect x="25" y="124" width="0" height="6" rx="3" fill="#F472B6">
          <animate attributeName="width"
                   values="0;165;165"
                   dur="2.9s"
                   repeatCount="indefinite"/>
      </rect>

      <rect
          x="-15"
          y="150"
          width="270"
          height="12"
          rx="6"
          fill="#CBD5E1"/>

  </g>

</svg>
